<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireframe Log Penjualan - Mantau Kopi</title>
  <link rel="stylesheet" href="./academic.css">
</head>
<body>
  <header class="hero">
    <div class="hero-copy">
      <p class="eyebrow">Wireframe Akademik</p>
      <h1>Log Penjualan Rider</h1>
      <p class="lede">Form input hasil penjualan dan riwayat log operasional rider.</p>
    </div>
    <nav class="hero-nav">
      <a href="./index.html">Kembali ke Induk</a>
    </nav>
  </header>
  <main class="page-shell">
    <article class="screen phone-pair">
      <div class="phone-frame">
        <div class="mobile-topbar">
          <div class="dot-grid"></div>
          <strong>Log Penjualan</strong>
          <div class="mobile-avatar"></div>
        </div>
        <div class="mobile-content">
          <label>Zona Tempat Berjualan</label>
          <div class="select-box">Zona Kampus ITS</div>
          <label>Jumlah Cup Terjual</label>
          <div class="input-box"></div>
          <label>Catatan</label>
          <div class="input-box tall"></div>
          <div class="button wide">Simpan Log</div>
          <div class="subhead section-gap">Riwayat Hari Ini</div>
          <div class="log-item">
            <strong>10:15 • 9 cup</strong>
            <small>Zona Kampus ITS</small>
          </div>
          <div class="log-item">
            <strong>13:40 • 6 cup</strong>
            <small>Zona SIER Rungkut</small>
          </div>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
