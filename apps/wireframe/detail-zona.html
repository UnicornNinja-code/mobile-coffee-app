<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireframe Detail Zona - Mantau Kopi</title>
  <link rel="stylesheet" href="./academic.css">
</head>
<body>
  <header class="hero">
    <div class="hero-copy">
      <p class="eyebrow">Wireframe Akademik</p>
      <h1>Detail Zona</h1>
      <p class="lede">Ringkasan nilai kriteria, skor TOPSIS, dan tombol navigasi untuk rider.</p>
    </div>
    <nav class="hero-nav">
      <a href="./index.html">Kembali ke Induk</a>
    </nav>
  </header>
  <main class="page-shell">
    <article class="screen phone-pair">
      <div class="phone-frame">
        <div class="mobile-topbar">
          <div class="dot-grid"></div>
          <strong>Detail Zona</strong>
          <div class="mobile-avatar"></div>
        </div>
        <div class="mobile-content">
          <div class="hero-card">
            <strong>Zona Kampus ITS</strong>
            <small>Skor TOPSIS 0.887</small>
          </div>
          <div class="stats-list">
            <div><span>C1 Densitas POI</span><strong>12</strong></div>
            <div><span>C2 Diversitas</span><strong>3</strong></div>
            <div><span>C3 Jarak</span><strong>2400 m</strong></div>
            <div><span>C4 Keramaian</span><strong>4.5</strong></div>
            <div><span>C5 Cuaca</span><strong>86.0</strong></div>
          </div>
          <div class="weather-strip">
            <span>Peluang hujan 30%</span>
            <span>Kondisi aman</span>
          </div>
          <div class="button wide">Navigasi ke Zona</div>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
